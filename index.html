<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ERP System</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="bg">

<!-- MAIN LOGIN CHOICE -->
<div id="loginBox" class="glass">

    <h2>Ahmed Digital Course</h2>

    <button onclick="showStudentLogin()">Student Login</button>
    <button onclick="showTeacherLogin()">Teacher Login</button>

</div>

<!-- STUDENT LOGIN -->
<div id="studentLogin" class="glass hidden">

    <h2>Student Login</h2>

    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <button onclick="loginStudent()">Login</button>

    <!-- 🔥 ADDED: REGISTER LINK -->
    <p onclick="showStudentRegister()" style="cursor:pointer;color:lightblue;">
        Create New Account
    </p>

</div>

<!-- 🔥 ADDED: STUDENT REGISTER -->
<div id="studentRegister" class="glass hidden">

    <h2>Student Register</h2>

    <input type="text" id="regName" placeholder="Full Name">
    <input type="text" id="regPhone" placeholder="Phone">
    <input type="email" id="regEmail" placeholder="Email">
    <input type="password" id="regPassword" placeholder="Password">

    <button onclick="registerStudent()">Create Account</button>

    <p onclick="showStudentLogin()" style="cursor:pointer;color:lightblue;">
        Already have account? Login
    </p>

</div>

<!-- TEACHER LOGIN -->
<div id="teacherLogin" class="glass hidden">

    <h2>Teacher Login</h2>

    <input type="password" id="teacherCode" placeholder="Enter Teacher Code">

    <button onclick="loginTeacher()">Login</button>

</div>

<!-- STUDENT DASHBOARD -->
<div id="studentDash" class="dashboard hidden">

    <h2>Student Portal</h2>

    <div class="topbar">
        <button onclick="myCourses()">My Courses</button>
        <button onclick="home()">Home</button>
        <button onclick="logout()">Logout</button>
    </div>

    <div id="studentInfo"></div>
    <div id="studentLectures"></div>

</div>

<!-- TEACHER DASHBOARD -->
<div id="teacherDash" class="dashboard hidden">

    <div class="topbar">

        <button onclick="home()">Home</button>
        <button onclick="createLecture()">Create Lecture</button>
        <button onclick="studentsList()">Students</button>

        <!-- 🔔 NOTIFICATION -->
        <button onclick="toggleNotifications()" style="position:relative;">
            🔔
            <span id="bellCount" style="
                position:absolute;
                top:-5px;
                right:-5px;
                background:red;
                color:white;
                border-radius:50%;
                padding:2px 6px;
                font-size:10px;
            ">0</span>
        </button>

        <button onclick="logout()">Logout</button>

    </div>

    <!-- NOTIFICATION BOX -->
    <div id="notifBox" style="
        display:none;
        position:absolute;
        right:20px;
        top:80px;
        width:260px;
        max-height:250px;
        overflow-y:auto;
        background:white;
        color:black;
        border-radius:10px;
        padding:10px;
        box-shadow:0 0 10px rgba(0,0,0,0.3);
        z-index:999;
    "></div>

    <div id="teacherContent"></div>

</div>

</div>

<script src="script.js"></script>
</body>
</html>
